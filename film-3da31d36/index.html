<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-180.png">

<style>
/* VOICE: quiet and exact, like a camera's own screen: the photo speaks, the chrome whispers.
   IDEA: a phone camera app: black ground, thin white lines, controls only where your thumb is.
   PICTURE: the photo itself, as large as the screen allows, with small overlay controls on its corners.
   COLOUR and TYPE: pure black, white, greys; one yellow only for the focus frame. Noto Sans KR 400/500, small and light.
   LAYOUT: top bar, photo, one tool panel, tab bar at the thumb. Above 900px the panel moves to a right column. */
:root{color-scheme:dark;--bg:#000;--ink:#f2f2f2;--mut:#8b8b8b;--dim:#5a5a5a;--line:#1f1f1f;--chip:#161616;--af:#ffd23f}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Noto Sans KR",-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.tbtn:focus-within{outline:1.5px solid #fff;outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:6px;height:52px;padding:0 max(10px,env(safe-area-inset-left)) 0 max(10px,env(safe-area-inset-right))}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;font-size:14px;color:var(--ink)}
.tbtn.q{color:var(--mut)}
.tbtn input{position:absolute;width:1px;height:1px;opacity:0}
.name{flex:1;text-align:center;font-size:13px;color:var(--mut);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name b{color:var(--ink);font-weight:500}

.view{position:relative;overflow:hidden;touch-action:manipulation}
.view canvas{position:absolute;inset:6px 0;width:100%;height:calc(100% - 12px);object-fit:contain;display:block}
.ov{position:absolute;bottom:14px;display:flex;gap:8px}
.ov.l{left:12px}.ov.r{right:12px}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28);color:#fff;transition:opacity .15s}
.rb:disabled{opacity:.3;cursor:default}
.rb svg.i{width:20px;height:20px}
.rb.on{background:#fff;color:#000}
.af{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border:1.5px solid var(--af);border-radius:3px;pointer-events:none;opacity:0;transform:scale(1.3);transition:opacity .2s,transform .2s}
.af.on{opacity:1;transform:scale(1)}
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);font-size:12px;color:#fff;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.badge.on{opacity:1}

.side{display:flex;flex-direction:column;border-top:.5px solid var(--line)}
.panel{height:188px;overflow-y:auto;padding:6px 18px 4px;overscroll-behavior:contain;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.pane[hidden]{display:none}
.tabs{display:flex;justify-content:space-around;padding:2px 8px calc(4px + env(safe-area-inset-bottom));border-top:.5px solid var(--line)}
.tab{flex:1;min-height:48px;font-size:13px;color:var(--dim);position:relative}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:50%;bottom:7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}

.reel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 2px 6px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.fr{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:7px;scroll-snap-align:center}
.fr canvas{width:72px;height:52px;border-radius:4px;object-fit:cover;background:#151515;display:block;outline:1.5px solid transparent;outline-offset:2px;transition:outline-color .15s}
.fr span{font-size:11px;color:var(--mut);line-height:1.25;text-align:center;width:100%;overflow-wrap:anywhere}
.fr[aria-pressed=true] canvas{outline-color:#fff}
.fr[aria-pressed=true] span{color:var(--ink)}
.sub{font-size:12px;color:var(--mut);text-align:center;margin:6px 0 0;min-height:17px}

.sl{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;align-items:center;gap:10px;min-height:52px}
.sl label{font-size:13px;color:var(--mut)}
.sl output{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl output.z{color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--trk,#333)}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--trk,#333)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
input[type=range]:disabled{opacity:.35}
.sg{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px;min-height:52px}
.sg>span{font-size:13px;color:var(--mut)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{flex:1;min-height:34px;padding:0 8px;border-radius:99px;font-size:13px;color:var(--mut);background:var(--chip)}
.pills button[aria-pressed=true]{background:var(--ink);color:#000}
.tip{font-size:12px;color:var(--mut);margin:4px 0 8px}

.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);padding:9px 15px;border-radius:99px;background:#f2f2f2;color:#000;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:9}
.sheet.on{display:flex}
.sheet img{max-width:100%;max-height:74vh;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.sheet p{margin:0;font-size:14px;color:var(--mut)}
.sheet button{min-height:44px;padding:0 22px;border-radius:99px;box-shadow:inset 0 0 0 .5px #555}

@media(min-width:900px){
 .app{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
 .top{grid-column:1/-1}
 .side{border-top:0;border-left:.5px solid var(--line)}
 .tabs{order:-1;border-top:0;border-bottom:.5px solid var(--line);padding-bottom:2px}
 .panel{height:auto;flex:1;padding-top:14px}
 .reel{flex-wrap:wrap;overflow:visible;gap:14px 10px}
 .fr{width:76px}.fr canvas{width:76px;height:54px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
 <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
 <symbol id="i-cmp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-open" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="m3 16 4-4 4 4 2-2 4 4"/><path d="M20 3v6M17 6h6"/></symbol>
 <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
</svg>
<div class="app">
 <header class="top">
  <button class="tbtn q" id="reset" type="button">초기화</button>
  <div class="name" id="name"><b>CLASSIC CHROME</b></div>
  <label class="tbtn" title="사진 열기"><svg class="i"><use href="#i-open"/></svg>열기<input type="file" id="file" accept="image/*"></label>
  <button class="tbtn" id="save" type="button"><svg class="i"><use href="#i-save"/></svg>저장</button>
 </header>
 <main class="view" id="view">
  <canvas id="cv" aria-label="보정된 사진 미리보기"></canvas>
  <div class="af" id="af"></div>
  <div class="badge" id="badge"></div>
  <div class="ov l">
   <button class="rb" id="undo" type="button" aria-label="이전 단계"><svg class="i"><use href="#i-undo"/></svg></button>
   <button class="rb" id="redo" type="button" aria-label="다시 실행"><svg class="i"><use href="#i-redo"/></svg></button>
  </div>
  <div class="ov r"><button class="rb" id="hold" type="button" aria-label="누르고 있는 동안 원본 보기"><svg class="i"><use href="#i-cmp"/></svg></button></div>
 </main>
 <section class="side">
  <div class="panel" id="panel">
   <div class="pane" data-p="film"><div class="reel" id="reel" role="group" aria-label="필름 시뮬레이션"></div><p class="sub" id="simk"></p></div>
   <div class="pane" data-p="tone" hidden></div>
   <div class="pane" data-p="color" hidden></div>
   <div class="pane" data-p="fx" hidden></div>
   <div class="pane" data-p="focus" hidden></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
   <button class="tab" role="tab" data-t="film" aria-selected="true">필름</button>
   <button class="tab" role="tab" data-t="tone" aria-selected="false">톤</button>
   <button class="tab" role="tab" data-t="color" aria-selected="false">컬러</button>
   <button class="tab" role="tab" data-t="fx" aria-selected="false">효과</button>
   <button class="tab" role="tab" data-t="focus" aria-selected="false">초점</button>
  </nav>
 </section>
</div>
<div class="sheet" id="sheet"><img id="outimg" alt="보정된 사진"><p>이미지를 길게 눌러 사진에 저장하세요</p><button id="close" type="button">닫기</button></div>
<div class="toast" id="toast" role="status"></div>
<script type="text/plain" id="engine">
const SIMS=[
 {id:'provia',sat:1,con:.12},
 {id:'velvia',sat:1.38,con:.3,bands:[['b','c',-.05,1.12],['g','y',.08,1.15],['r','r',0,1.1]]},
 {id:'astia',sat:1.1,con:.04,bands:[['r','y',.08,.95]],hi:[.012,.006,0]},
 {id:'cc',sat:.72,con:.26,blk:.025,wht:.03,bands:[['r','r',0,.78],['g','y',.22,.8],['b','c',.18,.85]],sh:[-.012,.006,.018],hi:[.015,.008,-.012]},
 {id:'pnh',sat:.88,con:.2,bands:[['r','y',.06,.92]]},
 {id:'pns',sat:.8,con:-.02,blk:.015,bands:[['r','y',.05,.9]]},
 {id:'cn',sat:.82,con:.34,blk:.02,wht:.03,bands:[['g','c',.25,.85],['r','y',.18,.9],['b','c',.1,.9]],sh:[-.03,.012,.008],hi:[.02,-.006,.004]},
 {id:'et',sat:.6,con:-.16,blk:.04,wht:.03,bands:[['g','c',.12,.85]],sh:[-.01,.006,.012]},
 {id:'ebb',sat:.32,con:.45,blk:.01},
 {id:'acros',mono:1,con:.3,grain:.5},
 {id:'mono',mono:1,con:.15},
 {id:'sepia',mono:1,con:.08,tint:[.07,.015]}
];
const yiq=(r,g,b)=>[.596*r-.274*g-.322*b,.211*r-.523*g+.312*b];
const ang=c=>{const q=yiq(c[0],c[1],c[2]);return Math.atan2(q[1],q[0])};
const HA={r:ang([1,.1,.1]),y:ang([1,.85,.1]),g:ang([.2,.8,.2]),c:ang([.1,.8,.9]),b:ang([.15,.3,1])};
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const GT=256,tile=new Float32Array(GT*GT);
{const raw=new Float32Array(GT*GT);for(let i=0;i<raw.length;i++)raw[i]=(Math.random()+Math.random()+Math.random()-1.5)*1.4;
 for(let y=0;y<GT;y++)for(let x=0;x<GT;x++){let s=0;for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++)s+=raw[((y+dy+GT)%GT)*GT+(x+dx+GT)%GT]*(dx||dy?.6:1.6);tile[y*GT+x]=s/4.4}}

function toneLUT(sim,S){
 const L=new Float32Array(1024),con=sim.con||0,blk=sim.blk||0,wht=sim.wht||0;
 for(let i=0;i<1024;i++){let y=i/1023;
  y=y+con*(y*y*(3-2*y)-y);
  y-=S.sh*.045*(1-y)*(1-y)*y*6.75;
  y+=S.hl*.045*y*y*(1-y)*6.75;
  y=blk+y*(1-blk-wht);
  L[i]=y<0?0:y>1?1:y}
 return L}

// colour pipeline baked into a 33^3 LUT: white balance, exposure, film sim, colour, colour chrome, tone, split tone
function buildCLUT(S,simId,N){
 const sim=SIMS.find(x=>x.id===simId)||SIMS[3],M=N-1,L=new Float32Array(N*N*N*3),lut=toneLUT(sim,S),ev=Math.pow(2,S.ev);
 const wr=1+S.wr*.012,wb=1+S.wb*.012,wg=1-(S.wr+S.wb)*.003,sat=(sim.sat||1)*(1+S.col*.1);
 const bands=(sim.bands||[]).map(b=>({c:HA[b[0]],dh:wrapA(HA[b[1]]-HA[b[0]])*b[2],m:b[3]}));
 const cce=[0,.12,.22][S.cce],ccb=[0,.14,.26][S.ccb],sh=sim.sh||[0,0,0],hi=sim.hi||[0,0,0],tint=sim.tint,BW=.65;
 let o=0;
 for(let bi=0;bi<N;bi++)for(let gi=0;gi<N;gi++)for(let ri=0;ri<N;ri++){
  let r=ri/M*wr*ev,g=gi/M*wg*ev,b=bi/M*wb*ev;
  let Y=.299*r+.587*g+.114*b,I=.596*r-.274*g-.322*b,Q=.211*r-.523*g+.312*b;
  if(sim.mono){I=0;Q=0}else{
   let C=Math.sqrt(I*I+Q*Q);
   if(C>1e-4){let h=Math.atan2(Q,I),dh=0,m=1,bw=0;
    for(const k of bands){const w=1-Math.abs(wrapA(h-k.c))/BW;if(w>0){dh+=k.dh*w;m*=1+(k.m-1)*w}}
    if(ccb){const w=1-Math.abs(wrapA(h-HA.b))/BW;if(w>0)bw=w}
    const cn=Math.min(C/.28,1);
    Y*=1-cce*cn*cn-ccb*bw*cn;
    C*=sat*m;h+=dh;I=C*Math.cos(h);Q=C*Math.sin(h)}}
  Y=lut[Math.max(0,Math.min(1023,(Y*1023)|0))];
  if(tint){const t=4*Y*(1-Y)+.25;I=tint[0]*t;Q=tint[1]*t}
  r=Y+.956*I+.621*Q;g=Y-.272*I-.647*Q;b=Y-1.106*I+1.703*Q;
  const s2=(1-Y)*(1-Y),h2=Y*Y;
  L[o++]=r+sh[0]*s2+hi[0]*h2;L[o++]=g+sh[1]*s2+hi[1]*h2;L[o++]=b+sh[2]*s2+hi[2]*h2}
 return L}

function apply(src,W,Hh,gscale,S,L,simId,N){
 const d=src.data,out=new ImageData(W,Hh),o=out.data,N1=N*3,N2=N*N*3,f=(N-1)/255,MX=N-2;
 const gAmt=[0,.035,.065][S.grain]+(simId==='acros'?.012:0),gs=Math.max(1,(S.gsize?2.2:1.1)*gscale),vig=S.vig*.06;
 for(let y=0,p=0;y<Hh;y++){const vy=(y/Hh-.5)*2,gy=(((y/gs)|0)&255)*GT;
  for(let x=0;x<W;x++,p+=4){
   const fr=d[p]*f,fg=d[p+1]*f,fb=d[p+2]*f;
   let ri=fr|0,gi=fg|0,bi=fb|0;if(ri>MX)ri=MX;if(gi>MX)gi=MX;if(bi>MX)bi=MX;
   const tr=fr-ri,tg=fg-gi,tb=fb-bi,i0=bi*N2+gi*N1+ri*3,i2=i0+N1,i4=i0+N2,i6=i4+N1;
   let a,b2,c,e,c0,c1,r,g,b;
   a=L[i0]+(L[i0+3]-L[i0])*tr;b2=L[i2]+(L[i2+3]-L[i2])*tr;c=L[i4]+(L[i4+3]-L[i4])*tr;e=L[i6]+(L[i6+3]-L[i6])*tr;
   c0=a+(b2-a)*tg;c1=c+(e-c)*tg;r=c0+(c1-c0)*tb;
   a=L[i0+1]+(L[i0+4]-L[i0+1])*tr;b2=L[i2+1]+(L[i2+4]-L[i2+1])*tr;c=L[i4+1]+(L[i4+4]-L[i4+1])*tr;e=L[i6+1]+(L[i6+4]-L[i6+1])*tr;
   c0=a+(b2-a)*tg;c1=c+(e-c)*tg;g=c0+(c1-c0)*tb;
   a=L[i0+2]+(L[i0+5]-L[i0+2])*tr;b2=L[i2+2]+(L[i2+5]-L[i2+2])*tr;c=L[i4+2]+(L[i4+5]-L[i4+2])*tr;e=L[i6+2]+(L[i6+5]-L[i6+2])*tr;
   c0=a+(b2-a)*tg;c1=c+(e-c)*tg;b=c0+(c1-c0)*tb;
   if(gAmt){const Y=.299*r+.587*g+.114*b,n=tile[gy+(((x/gs)|0)&255)]*gAmt*(.35+2.6*Y*(1-Y));r+=n;g+=n;b+=n}
   if(vig){const vx=(x/W-.5)*2,dd=vx*vx+vy*vy-.35;if(dd>0){const k=1-vig*dd;r*=k;g*=k;b*=k}}
   o[p]=r*255;o[p+1]=g*255;o[p+2]=b*255;o[p+3]=255}}
 return out}

// focus blur
const APK=[0,.005,.009,.015];
function box(a,t,w,h,r){const iv=1/(2*r+1);
 for(let y=0;y<h;y++){const o=y*w;let s=0;for(let k=-r;k<=r;k++)s+=a[o+(k<0?0:k>w-1?w-1:k)];
  for(let x=0;x<w;x++){t[x]=s;const xa=x+r+1,xb=x-r;s+=a[o+(xa>w-1?w-1:xa)]-a[o+(xb<0?0:xb)]}
  for(let x=0;x<w;x++)a[o+x]=t[x]*iv}
 for(let x=0;x<w;x++){let s=0;for(let k=-r;k<=r;k++)s+=a[(k<0?0:k>h-1?h-1:k)*w+x];
  for(let y=0;y<h;y++){t[y]=s;const ya=y+r+1,yb=y-r;s+=a[(ya>h-1?h-1:ya)*w+x]-a[(yb<0?0:yb)*w+x]}
  for(let y=0;y<h;y++)a[y*w+x]=t[y]*iv}}
function blurID(id,w,h,r){
 const n=w*h,d=id.data,P=[new Float32Array(n),new Float32Array(n),new Float32Array(n)],t=new Float32Array(Math.max(w,h));
 for(let i=0,p=0;i<n;i++,p+=4){const a=d[p]/255,b=d[p+1]/255,c=d[p+2]/255,q=Math.max(0,(.299*a+.587*b+.114*c-.7)/.3),k=1+2.5*q*q;P[0][i]=a*a*k;P[1][i]=b*b*k;P[2][i]=c*c*k}
 const rb=Math.max(1,Math.round(r/1.6));
 for(const a of P)for(let i=0;i<3;i++)box(a,t,w,h,rb);
 const out=new ImageData(w,h),o=out.data;
 for(let i=0,p=0;i<n;i++,p+=4){o[p]=Math.sqrt(P[0][i])*255;o[p+1]=Math.sqrt(P[1][i])*255;o[p+2]=Math.sqrt(P[2][i])*255;o[p+3]=255}
 return out}
function fmask(xn,yn,W,H,S){const L=Math.max(W,H),dx=(xn-S.fx)*W/L,dy=(yn-S.fy)*H/L,d=Math.sqrt(dx*dx+dy*dy),r0=S.fsz/100*.5,b=.1+r0*.8;let t=(d-r0)/b;t=t<0?0:t>1?1:t;return t*t*(3-2*t)}

reel.addEventListener('click',e=>{const b=e.target.closest('.fr');if(b)pick(b.dataset.id)});
reel.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();const i=NAMES.findIndex(n=>n[0]===S.sim);pick(NAMES[(i+(e.key==='ArrowRight'?1:NAMES.length-1))%NAMES.length][0],true)});
$('reset').addEventListener('click',()=>{S={...DEF,sim:S.sim};sync();request('full');commit();badge('초기화')});
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
 document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
 document.querySelectorAll('.pane').forEach(p=>p.hidden=p.dataset.p!==t.dataset.t);$('panel').scrollTop=0;
 if(t.dataset.t==='film'){const b=reel.querySelector('[aria-pressed=true]');if(b)b.scrollIntoView({block:'nearest',inline:'center'})}});

// photo area: focus tap, compare
function rect(){const r=cv.getBoundingClientRect(),s=Math.min(r.width/cv.width,r.height/cv.height),w=cv.width*s,h=cv.height*s;return{l:r.left+(r.width-w)/2,t:r.top+(r.height-h)/2,w,h}}
function showAF(){const v=$('view').getBoundingClientRect(),d=rect(),af=$('af');
 af.style.left=(d.l-v.left+S.fx*d.w)+'px';af.style.top=(d.t-v.top+S.fy*d.h)+'px';af.classList.add('on');clearTimeout(showAF.t);showAF.t=setTimeout(()=>af.classList.remove('on'),1300)}
cv.addEventListener('click',e=>{if(orig||!src)return;
 if(!S.ap){if(!$('tabs').querySelector('[data-t=focus][aria-selected=true]'))return;toast('아웃포커싱을 먼저 켜주세요');return}
 const d=rect();S.fx=Math.min(1,Math.max(0,(e.clientX-d.l)/d.w));S.fy=Math.min(1,Math.max(0,(e.clientY-d.t)/d.h));sync();request('full');commit();showAF()});
const hold=$('hold');
const setOrig=v=>{orig=v;hold.classList.toggle('on',v);ctx.drawImage(v?oc:fc,0,0);badge(v?'원본':'',v)};
hold.addEventListener('pointerdown',e=>{e.preventDefault();setOrig(true)});
['pointerup','pointerleave','pointercancel'].forEach(t=>hold.addEventListener(t,()=>orig&&setOrig(false)));
hold.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!orig){e.preventDefault();setOrig(true)}});
hold.addEventListener('keyup',()=>orig&&setOrig(false));
hold.addEventListener('contextmenu',e=>e.preventDefault());
function badge(t,stay){const b=$('badge');b.textContent=t;b.classList.toggle('on',!!t);clearTimeout(badge.t);if(t&&!stay)badge.t=setTimeout(()=>b.classList.remove('on'),900)}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

$('file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{let bmp;try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(_){bmp=await createImageBitmap(f)}
  exifT=null;try{exifT=EX.read(await f.arrayBuffer())}catch(_){}
  loadSource(bmp,bmp.width,bmp.height);toast(exifT?'촬영 정보도 함께 저장돼요':'이 사진에는 촬영 정보가 없어요')}
 catch(err){toast('이 사진은 열 수 없어요')}});

// save
let dl=null;
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}})();
function exportFull(){return new Promise(res=>{
 const k=Math.min(1,Math.sqrt(16e6/(src.w*src.h))),w=Math.round(src.w*k),h=Math.round(src.h*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(src.source,0,0,w,h);
 const sk=Math.min(1,1200/Math.max(w,h)),sc=document.createElement('canvas');sc.width=Math.round(w*sk);sc.height=Math.round(h*sk);const sx=sc.getContext('2d');sx.drawImage(src.source,0,0,sc.width,sc.height);
 wantX={msg:{type:'export',img:x.getImageData(0,0,w,h),small:sx.getImageData(0,0,sc.width,sc.height),S:{...S},k},done(img){x.putImageData(img,0,0);c.toBlob(async b=>res(exifT?new Blob([EX.insert(await b.arrayBuffer(),exifT)],{type:'image/jpeg'}):b),'image/jpeg',.94)}};
 pump()})}
$('save').addEventListener('click',async()=>{
 if(!src||wantX)return;badge('저장 중…',true);
 try{const blob=await exportFull(),name='film_'+S.sim+'_'+Date.now()+'.jpg';let done=false;badge('');
  if(dl){try{await dl.save({filename:name,data:blob});toast('저장했어요');done=true}
   catch(err){const c=err&&err.code;if(c==='declined'){toast('저장을 취소했어요');done=true}else if(c==='rate_limited'){toast('잠시 후 다시 시도해 주세요');done=true}}}
  if(!done&&!dl){const file=new File([blob],name,{type:'image/jpeg'});
   try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done=true}}catch(err){if(err&&err.name==='AbortError')done=true}
   if(!done&&!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('저장했어요');done=true}}
  if(!done){$('outimg').src=URL.createObjectURL(blob);$('sheet').classList.add('on')}}
 catch(e){badge('');toast('저장 중 문제가 생겼어요')}});
$('close').addEventListener('click',()=>{$('sheet').classList.remove('on');URL.revokeObjectURL($('outimg').src)});

function sample(){
 const c=document.createElement('canvas');c.width=1200;c.height=900;const x=c.getContext('2d');
 let gr=x.createLinearGradient(0,0,0,520);gr.addColorStop(0,'#3f7fd6');gr.addColorStop(1,'#cfe3f5');x.fillStyle=gr;x.fillRect(0,0,1200,520);
 x.fillStyle='#fff';for(const[a,b,r]of[[260,140,70],[330,120,90],[420,150,60],[820,210,80],[900,190,100],[990,220,70]]){x.beginPath();x.arc(a,b,r,0,7);x.fill()}
 x.fillStyle='#5b6f86';x.beginPath();x.moveTo(0,520);x.lineTo(300,330);x.lineTo(520,450);x.lineTo(760,300);x.lineTo(1200,500);x.lineTo(1200,560);x.lineTo(0,560);x.fill();
 gr=x.createLinearGradient(0,520,0,900);gr.addColorStop(0,'#7fbf3a');gr.addColorStop(1,'#3d7a1e');x.fillStyle=gr;x.fillRect(0,520,1200,380);
 for(const[cx,col]of[[180,'#e0322b'],[330,'#f2b21b'],[480,'#d8572a']]){x.fillStyle='#4a3326';x.fillRect(cx-8,640,16,120);x.fillStyle=col;x.beginPath();x.arc(cx,620,80,0,7);x.fill()}
 x.fillStyle='#e8c9a8';x.beginPath();x.arc(880,620,46,0,7);x.fill();x.fillStyle='#2b3f63';x.fillRect(830,666,100,160);x.fillStyle='#1a1a1a';x.fillRect(850,826,24,60);x.fillRect(886,826,24,60);
 loadSource(c,1200,900)}

startWorker();sync();hb();sample();toast('열기로 내 사진을 불러오세요');
requestAnimationFrame(()=>{const b=reel.querySelector('[aria-pressed=true]');if(b)b.scrollIntoView({block:'nearest',inline:'center'})});
}
</script>
</body>
